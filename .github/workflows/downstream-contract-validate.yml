name: downstream-contract-validate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: downstream-contract-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  downstream-contract-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate canonical dependency source
        run: |
          python scripts/generate_capability_registry_projections.py --root . --check
          python scripts/validate_capability_manifest.py --root .
          python scripts/validate_workspace_manifest.py --root .
      - name: Validate downstream contract schemas
        run: |
          python -m json.tool schemas/downstream/downstream-consumer-manifest.v1.schema.json >/dev/null
          python -m json.tool schemas/downstream/private-capability-extension.v1.schema.json >/dev/null
          python -m json.tool schemas/evidence/evidence-claim.v1.schema.json >/dev/null
          python -m json.tool schemas/evidence/delivery-evidence-asset-pack.v1.schema.json >/dev/null
          python -m json.tool schemas/evidence/delivery-asset-pack-validation-report.v1.schema.json >/dev/null
          python -m json.tool schemas/manager/manager-delivery-brief.v1.schema.json >/dev/null
          python -m json.tool feature-delivery-harness-mvp/schemas/evals/eval-case.v1.schema.json >/dev/null
          python -m json.tool feature-delivery-harness-mvp/schemas/evals/conformance-summary.v1.schema.json >/dev/null
      - name: Validate explicit eval manifests
        run: |
          find feature-delivery-harness-mvp/evals -name case.json -print0 |
            xargs -0 -n1 python -m json.tool >/dev/null
      - name: Validate schemas against committed contract instances
        run: python scripts/validate_downstream_schema_instances.py --root .
      - name: Validate public template syntax
        run: |
          python -m json.tool templates/private-repository/downstream-consumer-manifest.template.json >/dev/null
          python -m json.tool templates/private-repository/private-capability-extension.template.json >/dev/null
          python -m json.tool templates/delivery-evidence-asset-pack/asset-pack.manifest.template.json >/dev/null
          python -m json.tool templates/manager-delivery-brief/manager-brief.template.json >/dev/null
      - name: Test downstream consumer and private extension contracts
        run: python -m unittest discover -s tests -p 'test_downstream_consumer.py' -v
      - name: Test evidence and manager claim contracts
        run: python -m unittest discover -s tests -p 'test_manager_claims.py' -v
      - name: Test delivery asset-pack contract
        run: python -m unittest discover -s tests -p 'test_delivery_asset_pack.py' -v
      - name: Test heterogeneous eval runner contract
        run: python -m unittest discover -s tests -p 'test_mvp_eval_runner.py' -v
      - name: Test synthetic private consumer
        run: python -m unittest discover -s tests -p 'test_synthetic_private_consumer.py' -v
      - name: Run complete heterogeneous conformance suite
        run: |
          python feature-delivery-harness-mvp/scripts/run_mvp_evals.py \
            --summary-out conformance-summary.json
      - name: Compile local validators
        run: |
          python -m compileall -q scripts tests feature-delivery-harness-mvp/scripts examples/synthetic-private-consumer
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif [ -n "${{ github.event.before }}" ] &&
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" HEAD
          else
            git diff --check "$(git rev-list --max-parents=0 HEAD)" HEAD
          fi
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-conformance-evidence
          path: |
            conformance-summary.json
            feature-delivery-harness-mvp/reports/generated/
          if-no-files-found: warn
          retention-days: 14
