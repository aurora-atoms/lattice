name: pr48-regenerate

on:
  push:
    branches:
      - agent/bug-investigation-contract

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-investigation-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update canonical Delivery Rescue metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("registry/capability-manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          matches = [
              record
              for record in payload.get("capabilities", [])
              if record.get("record_type") == "skill" and record.get("family_name") == "delivery-rescue"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one delivery-rescue capability, found {len(matches)}")
          record = matches[0]
          record["capability_id"] = "skill:delivery-rescue@1.1.0"
          record["version"] = "1.1.0"
          legacy = record["projection"]["legacy_record"]
          legacy["side_effects"] = "repo_write"
          legacy["uses_scripts"] = True
          legacy["trigger_eval"] = "present"
          legacy["output_eval"] = "present"
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/generate_capability_registry_projections.py --root .
      - name: Verify legacy rebuild parity
        run: |
          python scripts/migrate_legacy_capabilities.py --root . --out /tmp/capability-manifest-rebuilt.json --force
          cmp registry/capability-manifest.json /tmp/capability-manifest-rebuilt.json
      - name: Commit deterministic outputs
        run: |
          if git diff --quiet; then
            echo "registry already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/capability-manifest.json registry/capability-context-policy.json registry/skill-context.catalog.json registry/agent-context.catalog.json registry/skills.index.jsonl registry/agents.index.jsonl registry/mcp_servers.index.jsonl registry/knowledge_packs.index.jsonl registry/workspace_templates.index.jsonl registry/capabilities.index.jsonl
          git commit -m "regenerate Delivery Rescue registry projections"
          git push origin HEAD:agent/bug-investigation-contract
