name: capability-profile-validate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: capability-profile-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capability-profile-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Validate profile contract syntax
        run: |
          python -m json.tool schemas/capability/capability-profile-runtime.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/portable-case-pack.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/workspace-handoff-verification-request.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/safety-critical-review.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/attention-admission-receipt.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/outcome-receipt.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/harness-mutation-candidate.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/blind-challenge-execution.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/reserved-evaluation-handoff-record.v1.schema.json >/dev/null
          python -m json.tool schemas/capability/reserved-evaluation-handoff-record.v2.schema.json >/dev/null
          python -m json.tool schemas/capability/reserved-evaluation-ingest-result.v1.schema.json >/dev/null
          python -m json.tool schemas/runtime-adapters/google-workspace-adapter-manifest.v1.schema.json >/dev/null
          python -m json.tool tests/fixtures/evidence-wayfinding/reserved-evaluation/trusted-evaluators.synthetic.json >/dev/null
          python -m json.tool workspaces/templates/senior-attention-runtime-profile.v1.json >/dev/null
          python -m json.tool runtime-adapters/google-workspace/senior-attention/adapter-source.v1.json >/dev/null
          python -m json.tool tests/fixtures/senior-attention-entry/routing-cases.v1.json >/dev/null
          find tests/fixtures/cross-workspace-handoff -name '*.json' -print0 |
            xargs -0 -n1 python -m json.tool >/dev/null
          find examples/capability-profiles -name '*.json' -print0 |
            xargs -0 -n1 python -m json.tool >/dev/null
          find examples/evidence-wayfinding -name '*.json' -print0 |
            xargs -0 -n1 python -m json.tool >/dev/null
          find examples/safety-critical-review -name '*.json' -print0 |
            xargs -0 -n1 python -m json.tool >/dev/null
      - name: Validate portable case pack reference fixture
        run: |
          python scripts/validate_json_schema_instance.py \
            schemas/capability/portable-case-pack.v1.schema.json \
            examples/evidence-wayfinding/portable-case-pack.synthetic.v1.json
          python scripts/validate_portable_case_pack.py \
            examples/evidence-wayfinding/portable-case-pack.synthetic.v1.json
      - name: Validate Blind Challenge completed synthetic fixture
        run: |
          python scripts/validate_json_schema_instance.py \
            schemas/capability/blind-challenge-execution.v1.schema.json \
            tests/fixtures/evidence-wayfinding/blind-challenge/evaluated.synthetic-conformance.json
          python scripts/validate_blind_challenge_execution.py \
            tests/fixtures/evidence-wayfinding/blind-challenge/evaluated.synthetic-conformance.json \
            examples/evidence-wayfinding/case-0-schema-parity/harness-mutation-candidate.json
      - name: Validate reserved evaluation handoff v1 compatibility fixture
        run: |
          python scripts/validate_reserved_evaluation_handoff.py \
            tests/fixtures/evidence-wayfinding/reserved-evaluation/handoff.synthetic-complete.jsonl \
            examples/evidence-wayfinding/case-0-schema-parity/harness-mutation-candidate.json \
            examples/evidence-wayfinding/case-0-schema-parity/blind-challenge-execution.blocked.json \
            --schema schemas/capability/reserved-evaluation-handoff-record.v1.schema.json
      - name: Validate trusted reserved evaluation handoff v2 fixture
        run: |
          python scripts/validate_reserved_evaluation_handoff_v2.py \
            tests/fixtures/evidence-wayfinding/reserved-evaluation/handoff.synthetic-complete.v2.jsonl \
            examples/evidence-wayfinding/case-0-schema-parity/harness-mutation-candidate.json \
            examples/evidence-wayfinding/case-0-schema-parity/blind-challenge-execution.blocked.json \
            --schema schemas/capability/reserved-evaluation-handoff-record.v2.schema.json \
            --trust-store tests/fixtures/evidence-wayfinding/reserved-evaluation/trusted-evaluators.synthetic.json \
            --consumed-nonces tests/fixtures/evidence-wayfinding/reserved-evaluation/consumed-nonces.empty.txt
      - name: Validate deterministic reserved attestation ingestion
        run: |
          python scripts/ingest_reserved_evaluation_attestation.py \
            tests/fixtures/evidence-wayfinding/reserved-evaluation/handoff.synthetic-complete.v2.jsonl \
            examples/evidence-wayfinding/case-0-schema-parity/harness-mutation-candidate.json \
            examples/evidence-wayfinding/case-0-schema-parity/blind-challenge-execution.blocked.json \
            --handoff-schema schemas/capability/reserved-evaluation-handoff-record.v2.schema.json \
            --trust-store tests/fixtures/evidence-wayfinding/reserved-evaluation/trusted-evaluators.synthetic.json \
            --consumed-nonces tests/fixtures/evidence-wayfinding/reserved-evaluation/consumed-nonces.empty.txt \
            --output /tmp/reserved-evaluation-ingest-result.json
          python scripts/validate_json_schema_instance.py \
            schemas/capability/reserved-evaluation-ingest-result.v1.schema.json \
            /tmp/reserved-evaluation-ingest-result.json
      - name: Validate capability profile semantics
        run: python scripts/validate_capability_profile.py --root .
      - name: Validate canonical Senior Attention profile
        run: |
          python scripts/validate_json_schema_instance.py \
            schemas/capability/capability-profile-runtime.v1.schema.json \
            workspaces/templates/senior-attention-runtime-profile.v1.json
          python scripts/validate_capability_profile.py \
            workspaces/templates/senior-attention-runtime-profile.v1.json \
            --root .
          python scripts/validate_capability_manifest.py --root .
          python scripts/generate_capability_registry_projections.py --root . --check
          python scripts/validate_capability_routing.py --root .
          python scripts/validate_public_private_boundary.py --root .
      - name: Validate Google Workspace Senior Attention adapter
        run: |
          python scripts/validate_json_schema_instance.py \
            schemas/runtime-adapters/google-workspace-adapter-manifest.v1.schema.json \
            runtime-adapters/google-workspace/senior-attention/adapter-source.v1.json
          python scripts/validate_google_workspace_adapter.py \
            runtime-adapters/google-workspace/senior-attention/adapter-source.v1.json \
            --root .
      - name: Validate Evidence Wayfinding Case 0 bundle
        run: |
          python scripts/validate_evidence_wayfinding_case_bundle.py \
            examples/evidence-wayfinding/case-0-schema-parity
      - name: Test capability profile boundaries
        run: python -m unittest discover -s tests -p 'test_capability_profile_runtime.py' -v
      - name: Test Senior Attention canonical entry
        run: python -m unittest discover -s tests -p 'test_senior_attention_entrypoint.py' -v
      - name: Validate safety-critical product review contract
        run: |
          python scripts/validate_safety_critical_review.py \
            examples/safety-critical-review/synthetic-target-binding.review.v1.json
          python -m unittest discover -s tests -p 'test_safety_critical_review.py' -v
      - name: Test Google Workspace Senior Attention adapter
        run: python -m unittest discover -s tests -p 'test_google_workspace_adapter.py' -v
      - name: Validate cross-workspace handoff conformance
        run: |
          python scripts/validate_cross_workspace_handoff.py \
            tests/fixtures/cross-workspace-handoff/feature-requirement.synthetic.json \
            --receipt tests/fixtures/cross-workspace-handoff/feature-requirement.receipt.json
          python scripts/validate_cross_workspace_handoff.py \
            tests/fixtures/cross-workspace-handoff/bug-investigation.synthetic.json \
            --receipt tests/fixtures/cross-workspace-handoff/bug-investigation.receipt.json
          python -m unittest discover -s tests -p 'test_cross_workspace_handoff_conformance.py' -v
      - name: Test portable case pack schema parity
        run: python -m unittest discover -s tests -p 'test_portable_case_pack_schema.py' -v
      - name: Test attention and outcome contracts
        run: python -m unittest discover -s tests -p 'test_attention_outcome_contracts.py' -v
      - name: Test Harness mutation candidate
        run: python -m unittest discover -s tests -p 'test_harness_mutation_candidate.py' -v
      - name: Test Blind Challenge execution
        run: python -m unittest discover -s tests -p 'test_blind_challenge_execution.py' -v
      - name: Test reserved evaluation handoff v1 compatibility
        run: python -m unittest discover -s tests -p 'test_reserved_evaluation_handoff.py' -v
      - name: Test reserved attestation trust boundary
        run: python -m unittest discover -s tests -p 'test_reserved_attestation_trust_boundary.py' -v
      - name: Test reserved attestation ingestion
        run: python -m unittest discover -s tests -p 'test_reserved_evaluation_ingestion.py' -v
      - name: Test Evidence Wayfinding Case 0
        run: python -m unittest discover -s tests -p 'test_evidence_wayfinding_case0.py' -v
      - name: Test authoritative Evidence Wayfinding case bundle
        run: python -m unittest discover -s tests -p 'test_evidence_wayfinding_case_bundle.py' -v
      - name: Test evidence wayfinding contracts
        run: python -m unittest discover -s tests -p 'test_evidence_wayfinding.py' -v
      - name: Compile validators and tests
        run: |
          python -m compileall -q scripts tests
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif [ -n "${{ github.event.before }}" ] &&
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" HEAD
          else
            git diff --check "$(git rev-list --max-parents=0 HEAD)" HEAD
          fi
