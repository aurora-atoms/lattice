name: skill-diagnose

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run focused Skill validation
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${GITHUB_HEAD_REF}" "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python scripts/validate_skill_package.py --root skills 2>&1 | tail -n 80
