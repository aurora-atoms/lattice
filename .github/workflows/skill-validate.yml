name: skill-validate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: skill-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolve comparison base
        id: comparison
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="HEAD^"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Inventory skills
        run: python scripts/inventory_skills.py --root skills --out skill_inventory.jsonl
      - name: Validate skills
        run: python scripts/validate_skill_package.py --root skills
      - name: Validate capability context catalogs
        run: python scripts/validate_capability_context.py --root .
      - name: Validate changed Skill authoring contracts
        run: python scripts/validate_skill_change_contract.py --base-ref "${{ steps.comparison.outputs.base_sha }}" --head-ref HEAD
      - name: Validate incremental Skill CI contracts
        run: |
          python scripts/validate_skill_ci_contracts.py \
            --base-ref "${{ steps.comparison.outputs.base_sha }}" \
            --head-ref HEAD \
            --report-out skill_ci_contract_report.json
      - name: Test incremental Skill CI contracts
        run: python -m unittest discover -s tests -p 'test_skill_ci_contracts.py' -v
      - name: Compile Python validation scripts
        run: python -m compileall -q scripts tests
      - name: Test capability context catalogs
        run: python -m unittest discover -s tests -p 'test_capability_context.py' -v
      - name: Validate capability context schema
        run: python -m json.tool schemas/capability/capability-context.v1.schema.json >/dev/null
      - name: Validate capability run result schema
        run: python -m json.tool schemas/capability/capability-run-result.v1.schema.json >/dev/null
      - name: Validate Skill CI contract report schema
        run: python -m json.tool schemas/capability/skill-ci-contract-report.v1.schema.json >/dev/null
      - name: Validate capability context JSON catalogs
        run: |
          python -m json.tool registry/skill-context.catalog.json >/dev/null
          python -m json.tool registry/agent-context.catalog.json >/dev/null
          python -m json.tool registry/capability-context-policy.json >/dev/null
      - name: Validate capability routing
        run: python scripts/validate_capability_routing.py --root .
      - name: Test capability routing
        run: python -m unittest discover -s tests -p 'test_route_capabilities.py' -v
      - name: Validate capability routing schema
        run: python -m json.tool schemas/capability/routing.decision.v1.schema.json >/dev/null
      - name: Test Feature Delivery Case lifecycle
        run: python -m unittest discover -s tests -p 'test_feature_delivery_case.py' -v
      - name: Validate Feature Delivery Case lifecycle schema
        run: python -m json.tool skills/feature-delivery-case/schemas/feature-delivery-case.lifecycle.v1.schema.json >/dev/null
      - name: Test decision question builder
        run: |
          python skills/decision-question-builder/scripts/validate_decision_question_packet.py skills/decision-question-builder/evals/fixtures/valid-decision-question.json
          python -m unittest discover -s skills/decision-question-builder/evals -p 'test_*.py' -v
      - name: Validate decision question packet schema
        run: python -m json.tool skills/decision-question-builder/schemas/decision-question-packet.v1.schema.json >/dev/null
      - name: Test unasked questions generator
        run: |
          python skills/unasked-questions-generator/scripts/validate_unasked_questions.py skills/unasked-questions-generator/evals/fixtures/valid-unasked-questions.json
          python -m unittest discover -s skills/unasked-questions-generator/evals -p 'test_*.py' -v
      - name: Validate unasked questions schema
        run: python -m json.tool skills/unasked-questions-generator/schemas/unasked-questions.v1.schema.json >/dev/null
      - name: Test VS Code AI configuration auditor
        run: python -m unittest discover -s skills/vscode-workspace-ai-context/evals -p 'test_*.py' -v
      - name: Validate pre-compact checkpoint schema
        run: python -m json.tool skills/vscode-workspace-ai-context/schemas/pre-compact-checkpoint.v1.schema.json >/dev/null
      - name: Audit repository AI configuration
        run: python skills/vscode-workspace-ai-context/scripts/audit_native_vscode_config.py --root . --format json --strict
      - name: Validate underscore prose rule
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/bad"
          cat > "$tmpdir/bad/SKILL.md" <<'EOF'
          ---
          name: bad-skill
          description: "Use for markdown input to output package while preserving behavior and validation. Do not use for coding."
          ---
          # Bad Skill
          ## Goal
          Validate bad rule.
          ## Use When
          Markdown input.
          ## Do Not Use When
          Coding.
          ## Inputs
          markdown input
          ## Outputs
          package output
          ## Workflow
          1. Preserve behavior.
          ## Rules
          BAD.001 | MUST | test | preserve_behavior_constraints_and_source_refs
          ## Verification
          Run validator.
          ## Failure Modes
          review_needed
          EOF
          if python scripts/validate_skill_package.py --root "$tmpdir/bad" > "$tmpdir/out" 2>&1; then
            cat "$tmpdir/out"
            echo "Expected underscore prose slug validation to fail."
            exit 1
          fi
          grep -q "uses non-contract underscore token" "$tmpdir/out"
      - name: Generate report
        run: python scripts/generate_skill_refactor_report.py --inventory skill_inventory.jsonl --out skill_quality_report.md
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-validation-evidence
          path: |
            skill_inventory.jsonl
            skill_quality_report.md
            skill_ci_contract_report.json
          if-no-files-found: warn
          retention-days: 14
