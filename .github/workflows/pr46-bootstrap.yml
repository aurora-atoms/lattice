name: pr46-bootstrap

on:
  push:
    branches:
      - agent/senior-attention-entry

permissions:
  contents: write

jobs:
  generate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/senior-attention-entry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate canonical registry changes
        run: python scripts/_pr46_manifest_patch.py
      - name: Commit deterministic registry output when needed
        run: |
          if git diff --quiet; then
            echo "registry already generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/capability-manifest.json registry/workspace_templates.index.jsonl registry/capabilities.index.jsonl
          git commit -m "register Senior Attention workflow and profile"
          git push origin HEAD:agent/senior-attention-entry
