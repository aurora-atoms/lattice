name: pr47-regenerate

on:
  push:
    branches:
      - agent/domain-context-contract

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/domain-context-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild canonical manifest and projections
        run: |
          python scripts/migrate_legacy_capabilities.py --root . --force
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('registry/capability-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          target = 'skill:domain-context-pack@1.1.0'
          matches = [item for item in manifest['capabilities'] if item['capability_id'] == target]
          if len(matches) != 1:
              raise SystemExit(f'expected one {target} record, found {len(matches)}')
          legacy = matches[0]['projection']['legacy_record']
          legacy['uses_scripts'] = True
          legacy['trigger_eval'] = 'present'
          legacy['output_eval'] = 'present'
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python scripts/generate_capability_registry_projections.py --root .
      - name: Commit deterministic outputs
        run: |
          if git diff --quiet; then
            echo "registry already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/capability-manifest.json registry/capability-context-policy.json registry/skill-context.catalog.json registry/agent-context.catalog.json registry/skills.index.jsonl registry/agents.index.jsonl registry/mcp_servers.index.jsonl registry/knowledge_packs.index.jsonl registry/workspace_templates.index.jsonl registry/capabilities.index.jsonl
          git commit -m "regenerate Domain Context Pack registry projections"
          git push origin HEAD:agent/domain-context-contract
