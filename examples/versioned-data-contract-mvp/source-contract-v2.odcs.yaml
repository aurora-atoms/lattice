apiVersion: v3.1.0
kind: DataContract
id: 2b25f9f1-8892-4e7b-9000-000000000001
name: synthetic_device_event
version: 2.0.0
status: active
domain: synthetic-reference
description:
  purpose: Demonstrate a producer contract after a physical field rename while the old source generation remains active.
  limitations: Synthetic reference only; no production authority or observed downstream adoption.
authoritativeDefinitions:
  - type: implementation
    url: https://example.invalid/contracts/synthetic-device-event/2.0.0/payload.schema.json
    description: Immutable payload schema reference for the synthetic v2 release.
schema:
  - id: device-event
    name: device_event
    logicalType: object
    description: One synthetic event emitted by a device.
    properties:
      - id: device-id
        name: device_id
        logicalType: string
        required: true
        description: Stable device identifier.
      - id: event-time
        name: event_time
        logicalType: timestamp
        required: true
        description: Time at which the event occurred, expressed in UTC.
      - id: conversion-status
        name: conversion_status
        businessName: Conversion status
        logicalType: string
        required: true
        description: Same business meaning as v1 `result_code`; the stable ID is intentionally unchanged while the physical name changes.
      - id: firmware-family
        name: firmware_family
        logicalType: string
        required: false
        description: Optional additive field introduced by the new device generation and not required by the canonical binding.
